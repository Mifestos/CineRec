[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinerec"
version = "2.0.0"
description = "Двухэтапная рекомендательная система (Retrieval + Ranking) с UGC и NLP-анализом отзывов"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Mifestos" },
]
keywords = ["recommender-system", "machine-learning", "fastapi", "nlp", "recsys"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: медленные тесты с реальной инфраструктурой (Postgres, Redis, модели)",
    "evaluation: A/B-тесты качества ML-моделей (требуют обученных весов)",
    "load: нагрузочные тесты через Locust",
]
addopts = "-v --cov=src/cinerec --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::UserWarning:huggingface_hub.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  

[tool.coverage.run]
source = ["src/cinerec"]
omit = [
    # CLI — тестируется в integration-тестах
    "src/cinerec/cli.py",
    # ML-обучение — тестируется в scheduled-tests.yml
    "src/cinerec/ranking/*",
    "src/cinerec/retrieval/train_als.py",
    # Pipeline — тестируется в integration-тестах (требует веса моделей)
    "src/cinerec/pipeline.py",
    "src/cinerec/retrieval/als_retriever.py",
    # NLP — тестируется отдельно (требует RuBERT)
    "src/cinerec/nlp/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]