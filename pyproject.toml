[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinerec"
version = "0.1.0"
description = "Двухэтапная рекомендательная система (поиск кандидатов и ранжирование) для MovieLens"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as slow integration tests (deselect with '-m \"not integration\"')"
]
addopts = "-v --cov=src/cinerec --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*", 
]