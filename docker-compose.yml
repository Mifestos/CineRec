services:
  api:
    build: .
    container_name: cinerec_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: cinerec_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes  