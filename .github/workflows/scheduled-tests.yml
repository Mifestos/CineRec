name: Scheduled ML Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  integration-and-evaluation:
    name: Integration + Evaluation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinerec_user
          POSTGRES_PASSWORD: cinerec_password
          POSTGRES_DB: cinerec_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # ВАЖНО: Используем small датасет (1 МБ) вместо 25M, чтобы не получить OOM
      - name: Download MovieLens Small dataset
        run: |
          mkdir -p data/raw
          curl -L -o /tmp/ml-latest-small.zip https://files.grouplens.org/datasets/movielens/ml-latest-small.zip
          unzip -q /tmp/ml-latest-small.zip -d /tmp/
          mv /tmp/ml-latest-small/*.csv data/raw/
          ls -la data/raw/

      - name: Train ALS model
        env:
          DATABASE_URL: postgresql://cinerec_user:cinerec_password@localhost:5432/cinerec_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_scheduled_tests_secret_key
        run: |
          # Исправленный путь после рефакторинга
          python src/cinerec/retrieval/als/train.py

      - name: Generate ranking features
        run: |
          # На small датасете это займет секунды
          python src/cinerec/ranking/features.py

      - name: Train ranker models
        run: |
          python src/cinerec/ranking/train_ranker.py

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://cinerec_user:cinerec_password@localhost:5432/cinerec_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_scheduled_tests_secret_key
        run: |
          pytest tests/integration/ -m integration -v

      - name: Run evaluation tests
        env:
          DATABASE_URL: postgresql://cinerec_user:cinerec_password@localhost:5432/cinerec_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_scheduled_tests_secret_key
        run: |
          pytest tests/evaluation/ -m evaluation -v