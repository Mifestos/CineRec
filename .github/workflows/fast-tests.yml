name: Fast Tests (Lint + Unit + API)

on:
  push:
    branches: [ "main", "develop", "v2.0-develop" ]
  pull_request:
    branches: [ "main", "v2.0-develop" ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Run ruff
        run: ruff check src tests --output-format=github

  test:
    name: Unit + API Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinerec_user
          POSTGRES_PASSWORD: cinerec_password
          POSTGRES_DB: cinerec_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit + api tests with coverage
        env:
          DATABASE_URL: postgresql://cinerec_user:cinerec_password@localhost:5432/cinerec_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_for_github_actions_only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest tests/unit/ tests/api/ \
            --cov=src/cinerec \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml